name: sdg

channels:
  - conda-forge

dependencies:
  # Python is 3.12 rather than 3.13, because the PDF and table stack is better
  # tested there.
  - python=3.12

  # Binary or compiled dependencies go through conda.
  - pymupdf        # PDF text extraction with layout and bounding boxes
  - pandas         # tables from the pinned workbooks, and scoring against eval/
  - openpyxl       # reads the pinned workbooks: the controlled terminology (CT), the CDISC Open Rules Engine (CORE) conformance rules, the crosswalks, the worked examples
  - pip

  - pip:
      - anthropic          # extraction and classification
      - pdfplumber         # table detection, complements pymupdf; used from Phase 1
      - pydantic>=2        # schemas generated from the pinned dataStructure.yml; used from Phase 3
      - neo4j              # graph driver
      - httpx              # the ClinicalTrials.gov and Digital Data Flow (DDF) services
      - python-dotenv      # reads .env once the pipeline calls the model; used from Phase 2
      - pyyaml             # reads the lookup document list in src/sdg/view/, and the prompt files later
      - pytest
      - pytest-cov         # measures which lines the checks reach, for the coverage gaps in validation/
