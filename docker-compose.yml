services:
  neo4j:
    image: neo4j:5-community
    container_name: sdg-neo4j
    ports:
      - "7474:7474"   # Browser (HTTP)
      - "7687:7687"   # Bolt (driver)
    environment:
      # Matches .env.example. Local development only.
      NEO4J_AUTH: neo4j/studydefinition
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
