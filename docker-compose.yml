services:
  neo4j:
    # The image is pinned to a patch version, not the floating `5-community` tag,
    # which moves to the newest 5.x on every pull. The reasoning is the same as for
    # the pinned USDM spec, because a version changing mid-project would make
    # failures unattributable. This image has the digest
    # sha256:d9dd3dc7d1c78fa959191ff02dbdcbefadceaf83eee23428fb92a58cac8ad3fe.
    image: neo4j:5.26.29-community
    container_name: sdg-neo4j
    # The container comes back after a host reboot or a Docker Desktop restart. It
    # is set to `unless-stopped` rather than `always`, so an explicit
    # `docker compose stop` stays stopped and "off" remains a state we choose.
    restart: unless-stopped
    ports:
      - "7474:7474"   # the browser page, served over HTTP, the protocol web pages use
      - "7687:7687"   # Bolt (driver)
    environment:
      # This matches .env.example. It is for local development only.
      NEO4J_AUTH: neo4j/studydefinition
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
