# Named groups of checks that pytest --group can run. Each group has one sentence
# saying what it is for and the ids of its checks, as validation_inventory.csv lists
# them. A group exists for a set that no folder, category or objective can name on
# its own. An id that no check carries stops the run.

pinned:
  purpose: Every check that reads a real pinned file. Run it after a file is re-pinned or newly fetched.
  ids:
    - SRC0128
    - USD0027
    - USD0029
    - USD0030
    - HRS0018

hook:
  purpose: The checks that reproduce what the pre-commit hook enforces. Run it when the hook refuses a commit and the reason is wanted as a report.
  ids:
    - HRS0010
    - HRS0060
    - HRS0046
    - HRS0170
