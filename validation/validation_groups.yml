# Named groups of checks that pytest --group can run.  Each group exists for a set that
# no folder, category or objective can name on its own.
# An invalid id stops the run.

# Each group has one sentence describing what it is for a list of check ids included
# in the group. A

pinned:
  purpose: Every check that reads a real pinned file. Run it after a file is re-pinned or newly fetched.
  ids:
    - SA00106
    - SA00153
    - SA00154
    - SA00155
    - SA00283

hook:
  purpose: The checks that reproduce what the pre-commit hook enforces. Run it when the hook refuses a commit and the reason is wanted as a report.
  ids:
    - SA00256
    - SA00391
    - SA00373
    - SA00374
