[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg"
version = "0.0.0"
requires-python = ">=3.12"

# Commands installed with the package, so a person types read_pdf rather than
# python -m sdg.view.read_pdf. Each names the module and the function it runs.
[project.scripts]
acquire_sources = "sdg.sources.acquire_sources:main"
read_pdf = "sdg.view.read_pdf:main"
read_xlsx = "sdg.view.read_xlsx:main"
usdm_spec = "sdg.usdm.usdm_spec:main"

[tool.setuptools.packages.find]
where = ["src"]

# The list of documents read_pdf can open is data beside the code, so it has to
# be installed with the package rather than left behind as a stray file.
[tool.setuptools.package-data]
"sdg.view" = ["*.yml"]

[tool.pytest.ini_options]
# validation/repo_tools/ imports the repo tools by name (import build_index), which
# needs repo_tools/ on the import path. Declared here once, not in each test file.
pythonpath = ["repo_tools"]
testpaths = ["validation"]

[tool.ruff]
# Line length matches ruff's default formatter width. src, repo_tools and validation are
# the three folders the writing_python_files rule covers.
line-length = 88
target-version = "py312"
src = ["src", "repo_tools", "validation"]

[tool.ruff.lint]
# E and W are PEP 8 style, F is pyflakes (unused names, undefined names), I is
# import ordering, B is common bug patterns, UP is modern syntax for the pinned
# Python version.
select = ["E", "W", "F", "I", "B", "UP"]
# Line length is the formatter's job. What it cannot wrap is a string, and a
# message split across lines is harder to grep for.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sdg"]

[tool.mypy]
# Every function must carry hints, per the writing_python_files rule. The
# packages below ship no type stubs, so their imports are allowed untyped.
python_version = "3.12"
files = ["src", "repo_tools", "validation"]
# validation/repo_tools/ imports the repo tools by bare name, as pytest does.
mypy_path = ["src", "repo_tools", "."]
# With explicit package bases every test file is named validation.<folder>.<file>, so
# one override pattern below covers the whole folder, present and future.
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "openpyxl", "openpyxl.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Checks take their arguments from pytest fixtures, and a label on each would
# only repeat the argument's name. Tests are exempt from the hint requirement
# but are still checked for everything mypy can find without hints.
module = ["validation.*"]
disallow_untyped_defs = false
