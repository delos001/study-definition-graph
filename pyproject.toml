[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg"
version = "0.0.0"
requires-python = ">=3.12"

# These commands are installed with the project, so a person types read_pdf rather
# than python -m sdg.view.read_pdf. Each names the module and the function it runs.
[project.scripts]
acquire_sources = "sdg.sources.acquire_sources:main"
read_pdf = "sdg.view.read_pdf:main"
read_xlsx = "sdg.view.read_xlsx:main"
usdm_spec = "sdg.usdm.usdm_spec:main"
check_api_key = "sdgtools.check_api_key:main"
check_neo4j = "sdgtools.check_neo4j:main"
find_unrecorded_files = "sdgtools.find_unrecorded_files:main"
check_sources_map = "sdgtools.check_sources_map:main"
check_facts = "sdgtools.check_facts:main"
check_python_files = "sdgtools.check_python_files:main"
build_index = "sdgtools.build_index:main"
verify_headers = "sdgtools.verify_headers:main"

[tool.setuptools.packages.find]
where = ["src"]

# The list of documents read_pdf can open is data beside the code, so it has to
# be installed with the package rather than left behind as a stray file.
[tool.setuptools.package-data]
"sdg.view" = ["*.yml"]

[tool.pytest.ini_options]
# validation/repo_tools/ imports the repo tools by name (import build_index), and
# validation/claude_hooks/ imports the Claude Code hooks the same way, so both folders
# go on the import path. They are declared here once, not in each test file.
# The repo root is on the path too, so validation/select_checks.py can be named
# below by its dotted name, the same name mypy knows it by.
pythonpath = ["repo_tools", ".claude/hooks", "."]
testpaths = ["validation"]
# validation/select_checks.py adds the options that select checks by category,
# objective, id or group. It is loaded here as a plugin, because pytest reads the
# command line before it loads validation/conftest.py, so an option added there
# would be unknown at that moment and its value taken for a path.
addopts = "-p validation.select_checks"

[tool.ruff]
# Line length matches ruff's default formatter width. The four folders listed are the
# ones .claude/rules/writing_python_files.md covers.
line-length = 88
target-version = "py312"
src = ["src", "repo_tools", "validation", ".claude/hooks"]

[tool.ruff.lint]
# E and W are PEP 8 style, F is pyflakes (unused names, undefined names), I is
# import ordering, B is common bug patterns, UP is modern syntax for the pinned
# Python version.
select = ["E", "W", "F", "I", "B", "UP"]
# Line length is the formatter's job. What it cannot wrap is a string, and a
# message split across lines is harder to grep for.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sdg"]

[tool.mypy]
# Every function must carry hints, as .claude/rules/writing_python_files.md requires. The
# packages below ship no type stubs, so their imports are allowed untyped.
python_version = "3.12"
files = ["src", "repo_tools", "validation", ".claude/hooks"]
# validation/repo_tools/ and validation/claude_hooks/ import the repo tools and the
# hooks by bare name, as pytest does.
mypy_path = ["src", "repo_tools", ".claude/hooks", "."]
# With explicit package bases every test file is named validation.<folder>.<file>, so
# one override pattern below covers the whole folder, present and future.
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "openpyxl", "openpyxl.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Checks take their arguments from pytest fixtures, and a label on each would
# only repeat the argument's name. Tests are exempt from the hint requirement
# but are still checked for everything mypy can find without hints.
module = ["validation.*"]
disallow_untyped_defs = false
